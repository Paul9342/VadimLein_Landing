<style>
  :root {
    --bg-from: #bcc2cb;
    --bg-to: #ffffff;
    --surface: rgba(255,255,255,.72);
    --line: #dcdde1;
    --text: #2b2d31;
    --muted: #6b6e75;
    --accent: #1e3a6b;
    --accent-hover: #162c52;
    --error: #a33a3a;
    --ph: #ecedf0;
    --serif: "Forum", Georgia, serif;
    --sans: "Forum", Georgia, serif;
    --wrap: 1160px;
    /* Три размера текста на всю страницу (кроме шапки с именем) */
    --fs-l: clamp(34px, 4.6vw, 54px);
    --fs-m: 20px;
    --fs-s: 16px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font: 400 var(--fs-m)/1.6 var(--sans);
    color: var(--text);
    background: var(--bg-to);
    -webkit-font-smoothing: antialiased;
  }
  /* Фон: серо-белый градиент с шёлковыми лентами. Слой закреплён, чтобы работать и на iOS */
  .bg {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(ellipse 70% 55% at 45% 100%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 100%),
      linear-gradient(165deg, var(--bg-from) 0%, #d7dbe1 30%, #eaecef 60%, #f6f7f8 85%);
  }
  .bg svg { width: 100%; height: 100%; display: block; }
  img { display: block; max-width: 100%; }
  a { color: var(--accent); }
  h1, h2, h3, .serif { font-family: var(--serif); font-weight: 400; letter-spacing: .01em; }
  h1 { font-size: var(--fs-l); line-height: 1.1; margin: 0 0 24px; }
  h2 { font-size: var(--fs-l); line-height: 1.15; margin: 0 0 16px; }
  h3 { font-size: var(--fs-m); line-height: 1.2; margin: 0 0 8px; }
  p { margin: 0 0 16px; }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }
  section { padding: 96px 0; }
  .eyebrow { font-size: var(--fs-s); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; font-weight: 400; }
  .lead { color: var(--muted); max-width: 560px; }
  .section-head { margin-bottom: 48px; max-width: 640px; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 32px; border: 1px solid var(--accent); border-radius: 2px;
    background: var(--accent); color: #fff; text-decoration: none;
    font: 400 var(--fs-s)/1 var(--sans); letter-spacing: .08em; text-transform: uppercase;
    cursor: pointer; transition: background .2s, color .2s;
  }
  .btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.ghost:hover { background: var(--accent); color: #fff; }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }

  /* Photo placeholders: shown until a real photo is placed in img/ */
  .photo { position: relative; background: var(--ph); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo.zoom img { cursor: zoom-in; transition: transform .6s ease; }
  .photo.zoom:hover img { transform: scale(1.02); }
  .photo.missing img { display: none; }
  .photo.missing::after {
    content: attr(data-label);
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center;
    font-size: var(--fs-s); letter-spacing: .14em; text-transform: uppercase; color: #9a9da4;
    border: 1px solid var(--line);
  }

  /* 1. Header */
  header.site { padding: 32px 0 0; }
  header.site .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .logo { font-family: var(--serif); font-size: clamp(52px, 8vw, 80px); color: var(--text); text-decoration: none; line-height: 1; }
  .logo span { font-size: clamp(30px, 4vw, 40px); color: var(--muted); margin-left: 12px; }
  .lang { display: flex; gap: 4px; }
  .lang button {
    background: none; border: 0; padding: 6px 8px; cursor: pointer;
    font: 400 var(--fs-s) var(--sans); letter-spacing: .12em; color: var(--muted);
  }
  .lang button[aria-pressed="true"] { color: var(--accent); border-bottom: 1px solid var(--accent); }

  /* 2. Hero */
  .hero { padding-top: 64px; }
  .hero .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
  .hero .photo { aspect-ratio: 4 / 5; }
  .perks { list-style: none; padding: 0; margin: 40px 0 0; display: grid; gap: 12px; }
  .perks li { display: flex; gap: 14px; align-items: flex-start; font-size: var(--fs-m); }
  /* Чёрточка держится на уровне первой строки, даже если текст переносится */
  .perks li::before { content: ""; width: 24px; height: 1px; background: var(--accent); flex: none; margin-top: .8em; }

  /* 3. Interiors */
  .interiors { display: grid; grid-template-columns: repeat(6, 1fr); gap: 24px; }
  .interiors figure { margin: 0; grid-column: span 2; }
  .interiors figure:nth-child(1), .interiors figure:nth-child(2) { grid-column: span 3; }
  .interiors .photo { aspect-ratio: 4 / 5; }
  figcaption { font-size: var(--fs-s); color: var(--muted); padding-top: 12px; }
  figcaption strong { display: block; font-weight: 400; color: var(--text); font-size: var(--fs-m); }
  figcaption span { display: block; margin-top: 2px; font-style: italic; color: #4a4d54; }

  /* 4. About */
  .about .wrap { display: grid; grid-template-columns: 5fr 7fr; gap: 72px; align-items: start; }
  .about .photo { aspect-ratio: 4 / 5; }
  /* Фон на фото автора яркий — приглушаем до мягкого ч/б */
  .about .photo img { filter: grayscale(1) contrast(.9) brightness(1.06); }
  .questions { margin-top: 24px; font-style: italic; color: var(--muted); font-size: var(--fs-m); }
  .questions p { margin: 0 0 6px; }

  /* 5. Catalog */
  .catalog { display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px 32px; }
  .card .photo { aspect-ratio: 3 / 4; margin-bottom: 20px; }
  .card .meta { font-size: var(--fs-s); color: var(--muted); margin: 0 0 4px; }
  .card .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; gap: 12px; }
  .price { font-family: var(--serif); font-size: var(--fs-m); }
  .status { font-size: var(--fs-s); letter-spacing: .1em; text-transform: uppercase; }
  .status.in { color: var(--accent); }
  .status.order { color: var(--muted); }
  .card .ask { display: inline-block; margin-top: 10px; font-size: var(--fs-s); text-decoration: none; border-bottom: 1px solid currentColor; }
  .info-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 72px; }
  .info { background: var(--surface); border: 1px solid var(--line); padding: 36px; }
  .info p:last-child { margin: 0; }
  .info p { color: var(--muted); font-size: var(--fs-m); }

  /* 6. Quote */
  .quote { text-align: center; }
  .quote blockquote { margin: 0 auto; max-width: 800px; }
  .quote blockquote p { font-family: var(--serif); font-size: var(--fs-l); line-height: 1.35; margin-bottom: 24px; }
  .quote cite { font-style: normal; font-family: var(--serif); font-size: var(--fs-m); color: var(--muted); }

  /* 7. CTA */
  .cta { text-align: center; }
  .cta .lead { margin: 0 auto 36px; }
  .cta .buttons, .review .buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

  /* 8. Form */
  .order .wrap { display: grid; grid-template-columns: 5fr 7fr; gap: 72px; }
  form { background: var(--surface); border: 1px solid var(--line); padding: 40px; display: grid; gap: 20px; }
  label { display: grid; gap: 6px; font-size: var(--fs-s); letter-spacing: .06em; color: var(--muted); }
  .err { display: none; color: var(--error); letter-spacing: 0; }
  .err.show { display: block; }
  input.invalid, select.invalid { border-color: var(--error); }
  input, select {
    font: 400 var(--fs-m) var(--sans); color: var(--text);
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 2px; background: #fff; width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .hp { position: absolute; left: -9999px; }
  .form-note { font-size: var(--fs-s); color: var(--muted); margin: 0; }

  /* 9. Review */
  .review { text-align: center; padding: 72px 0; }
  .review .lead { margin: 0 auto 28px; }

  /* 10. Footer */
  footer { border-top: 1px solid var(--line); padding: 40px 0; font-size: var(--fs-s); color: var(--muted); }
  footer .wrap { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
  footer nav { display: flex; gap: 24px; }
  footer a { color: var(--text); text-decoration: none; }
  footer a:hover { color: var(--accent); }
  footer .logo { font-size: var(--fs-m); }

  /* Lightbox */
  dialog.lb { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
  dialog.lb::backdrop { background: rgba(250,250,251,.96); }
  dialog.lb img { max-width: 92vw; max-height: 84vh; object-fit: contain; margin: 0 auto; box-shadow: 0 20px 60px rgba(0,0,0,.12); }
  dialog.lb p { text-align: center; color: var(--muted); margin: 16px 0 0; font-size: var(--fs-s); }
  dialog.lb button { position: fixed; top: 16px; right: 20px; background: none; border: 0; font: 400 var(--fs-l)/1 var(--sans); color: var(--text); cursor: pointer; }

  @media (max-width: 900px) {
    section { padding: 64px 0; }
    .hero { padding-top: 40px; }
    .hero .wrap, .about .wrap, .order .wrap { grid-template-columns: 1fr; gap: 40px; }
    .interiors, .catalog, .info-cards { grid-template-columns: 1fr; }
    .interiors figure, .interiors figure:nth-child(1), .interiors figure:nth-child(2) { grid-column: auto; }
    .catalog { gap: 48px; }
    .info-cards { margin-top: 56px; }
  }
  @media (max-width: 560px) {

    .wrap { padding: 0 16px; }
    header.site .wrap { flex-direction: column; gap: 12px; }
    /* На телефоне «Art Studio» — второй строкой под именем */
    .logo span { display: block; margin: 8px 0 0 2px; }
    form, .info { padding: 24px; }
    .btn { width: 100%; }
    footer nav { flex-wrap: wrap; gap: 16px; }
  }
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
let lang = "ru";

function markMissing(img) {
  const show = () => img.closest(".photo").classList.add("missing");
  if (img.complete && img.naturalWidth === 0) show();
  img.addEventListener("error", show);
}

function photo(src, label, alt, zoom, pos) {
  const style = pos ? ` style="object-position:${pos}"` : "";
  return `<div class="photo${zoom ? " zoom" : ""}" data-label="${label}"><img src="${src}" alt="${alt}" loading="lazy"${style}></div>`;
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $$("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  $$("[data-i18n-alt]").forEach(el => el.alt = t[el.dataset.i18nAlt]);
  $$(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  $("#interiorList").innerHTML = INTERIORS.map(i =>
    `<figure>${photo(i.img, i.img.split("/")[1], i[lang], true, i.pos)}<figcaption><strong>${i[lang]}</strong><span>${i.note[lang]}</span></figcaption></figure>`
  ).join("");

  $("#catalogList").innerHTML = PAINTINGS.map((p, n) => `
    <article class="card">
      ${photo(p.img, p.img.split("/")[1], p.name[lang], true)}
      <h3>${p.name[lang]}</h3>
      <p class="meta">${p.size} ${t["cat.size"]}</p>
      <p class="meta">${t["cat.technique"]}</p>
      <div class="row">
        <span class="status ${p.stock ? "in" : "order"}">${p.stock ? t["cat.in"] : t["cat.order"]}</span>
        <span class="price">$${p.price}</span>
      </div>
      <a class="ask" href="#order" data-pick="${n}">${t["cat.ask"]}</a>
    </article>`).join("");

  const sel = $("#paintingSelect");
  const prev = sel.selectedIndex;
  sel.innerHTML = `<option value="" disabled selected>${t["form.choose"]}</option>` +
    PAINTINGS.map(p => `<option value="${p.name.ru} — ${p.size} см — $${p.price}">${p.name[lang]} — ${p.size} ${t["cat.size"]} — $${p.price}</option>`).join("") +
    `<option value="Другая / обсудить">${t["form.other"]}</option>`;
  if (prev > 0) sel.selectedIndex = prev;
  $("#formLang").value = lang.toUpperCase();

  const msg = encodeURIComponent(t["cta.msg"]);
  $("#waCta").href = `https://wa.me/${WA}?text=${msg}`;
  $("#tgCta").href = `https://t.me/${TG}`;
  $("#waReview").href = `https://wa.me/${WA}?text=${encodeURIComponent(t["review.msg"])}`;

  $$(".photo img").forEach(markMissing);

  /* Уже показанные подсказки — на новом языке */
  $$(".err.show").forEach(e => e.textContent = t[e.dataset.key]);
}

/* Проверка формы: возвращает ключ подсказки или "" если поле заполнено верно */
const CHECKS = {
  fName:  el => el.value.trim() ? "" : "err.name",
  fEmail: el => !el.value.trim() ? "err.email" : el.validity.typeMismatch ? "err.emailBad" : "",
  fPhone: el => {
    const v = el.value.trim();
    if (!v) return "err.phone";
    const digits = v.replace(/\D/g, "").length;
    return /^[+\d\s()\-.]+$/.test(v) && digits >= 7 && digits <= 15 ? "" : "err.phoneBad";
  },
  paintingSelect: el => el.value ? "" : "err.painting"
};

function validateField(el) {
  const key = CHECKS[el.id](el);
  const err = $("#" + el.getAttribute("aria-describedby"));
  el.classList.toggle("invalid", !!key);
  el.setAttribute("aria-invalid", key ? "true" : "false");
  err.classList.toggle("show", !!key);
  err.dataset.key = key;
  err.textContent = key ? T[lang][key] : "";
  return !key;
}

const form = $("#orderForm");
form.addEventListener("submit", e => {
  const fields = Object.keys(CHECKS).map(id => $("#" + id));
  const bad = fields.filter(el => !validateField(el));
  if (bad.length) {
    e.preventDefault();
    bad[0].focus();
  }
});
/* Подсказка исчезает, как только поле исправлено */
Object.keys(CHECKS).forEach(id => {
  const el = $("#" + id);
  const recheck = () => { if (el.classList.contains("invalid")) validateField(el); };
  el.addEventListener("input", recheck);
  el.addEventListener("change", recheck);
});

function setLang(l) {
  lang = T[l] ? l : "ru";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render();
}

$$(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* Выбор картины в форме по ссылке «Оставить заявку» */
document.addEventListener("click", e => {
  const a = e.target.closest("[data-pick]");
  if (!a) return;
  const sel = $("#paintingSelect");
  sel.selectedIndex = +a.dataset.pick + 1;
  if (sel.classList.contains("invalid")) validateField(sel);
});

/* Лайтбокс */
const lb = $("#lightbox");
document.addEventListener("click", e => {
  const img = e.target.closest(".photo.zoom:not(.missing) img");
  if (!img) return;
  $("img", lb).src = img.src;
  $("p", lb).textContent = img.alt;
  lb.showModal();
});
lb.addEventListener("click", () => lb.close());

let saved = null;
try { saved = localStorage.getItem("lang"); } catch (e) {}
if (!saved) {
  const nav = (navigator.language || "ru").slice(0, 2);
  saved = nav === "es" ? "es" : nav === "en" ? "en" : "ru";
}
setLang(saved);
</script>
